<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile | GameZone</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070b12;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .profile {
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 35px;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
    }

    h1 {
      margin-top: 20px;
    }

    .email {
      color: #94a3b8;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 30px;
    }

    .stat {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
    }

    .stat h2 {
      color: #38bdf8;
    }

    .stat p {
      color: #94a3b8;
      margin-top: 6px;
    }

    button {
      margin-top: 30px;
      padding: 14px 30px;
      border: none;
      border-radius: 9px;
      background: #dc2626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      color: #38bdf8;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 0 6px;
        font-size: 13px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      🎮 Game<span>Zone</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="missions.html">Missions</a>
      <a href="news.html">News</a>
    </nav>

  </header>


  <main class="profile">

    <div class="card">

      <div class="avatar">
        👤
      </div>

      <h1 id="username">
        Loading...
      </h1>

      <p class="email" id="email">
        Loading...
      </p>


      <div class="stats">

        <div class="stat">
          <h2>0</h2>
          <p>Points</p>
        </div>

        <div class="stat">
          <h2>0</h2>
          <p>Missions</p>
        </div>

        <div class="stat">
          <h2>#--</h2>
          <p>Rank</p>
        </div>

      </div>


      <div id="message"></div>

      <button id="logout">
        🚪 LOGOUT
      </button>

    </div>

  </main>


  <script>

    const SUPABASE_URL = "YOUR_PROJECT_URL";

    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadProfile() {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      document.getElementById("email")
        .textContent = user.email;


      const {
        data: profile,
        error
      } = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();


      if (error) {

        document.getElementById("username")
          .textContent = "Player";

        return;
      }


      document.getElementById("username")
        .textContent = profile.username;

    }


    document
      .getElementById("logout")
      .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

      });


    loadProfile();

  </script>

</body>
</html>
