<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | GameZone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070b12;
      color: white;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #111827;
      padding: 35px;
      border-radius: 18px;
      border: 1px solid #263244;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #0f172a;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .register-btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #1d4ed8;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      color: #38bdf8;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 2;
    }

    .links a {
      color: #38bdf8;
      text-decoration: none;
    }

    .home {
      display: block;
      color: #94a3b8 !important;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">
      🎮 Game<span>Zone</span>
    </div>

    <p class="subtitle">
      Create your gaming account
    </p>

    <form id="registerForm">

      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="Choose a username"
        required
      >

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Repeat your password"
        required
      >

      <button class="register-btn" type="submit">
        🚀 CREATE ACCOUNT
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="links">

      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>

      <a class="home" href="index.html">
        🏠 Back to Home
      </a>

    </div>

  </div>


  <script>

    document
      .getElementById("registerForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value;

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");


        if (password !== confirmPassword) {

          message.textContent =
            "⚠️ Passwords do not match.";

          return;
        }


        message.textContent =
          "✅ Account form completed!";

      });

  </script>

</body>
</html>
