<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | GameZone</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070b12;
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #111827;
      padding: 35px;
      border-radius: 18px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #38bdf8;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      🎮 Game<span>Zone</span>
    </div>

    <p class="subtitle">
      Create your GameZone account
    </p>

    <form id="registerForm">

      <label>Username</label>

      <input
        id="username"
        type="text"
        placeholder="Choose username"
        required
      >

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter email"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Create password"
        minlength="6"
        required
      >

      <button type="submit">
        🚀 CREATE ACCOUNT
      </button>

    </form>

    <div id="message"></div>

    <div class="links">
      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>

      <br>

      <a href="index.html">🏠 Back Home</a>
    </div>

  </div>


  <script>

    const SUPABASE_URL = "YOUR_PROJECT_URL";

    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        message.textContent = "Creating account...";


        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        if (error) {

          message.textContent =
            "❌ " + error.message;

          return;
        }


        if (!data.user) {

          message.textContent =
            "❌ Account could not be created.";

          return;
        }


        const { error: profileError } =
          await supabaseClient
            .from("profiles")
            .insert({
              id: data.user.id,
              username: username
            });


        if (profileError) {

          message.textContent =
            "Account created, but profile failed: "
            + profileError.message;

          return;
        }


        message.textContent =
          "✅ Account created successfully!";


        document
          .getElementById("registerForm")
          .reset();

      });

  </script>

</body>
</html>
