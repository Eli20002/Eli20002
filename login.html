<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | GameZone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.95)),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      padding: 35px;
      border-radius: 18px;
      border: 1px solid #263244;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .password-box {
      position: relative;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 14px;
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #38bdf8;
    }

    .links {
      text-align: center;
      margin-top: 25px;
      line-height: 2;
    }

    .links a {
      color: #38bdf8;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #94a3b8 !important;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🎮 Game<span>Zone</span>
    </div>

    <p class="subtitle">
      Login to your gaming account
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <div class="password-box">

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword()"
        >
          Show
        </button>

      </div>

      <button type="submit" class="login-btn">
        🔐 LOGIN
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="links">

      <p>
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>

      <p>
        <a href="#">Forgot Password?</a>
      </p>

      <a class="home" href="index.html">
        🏠 Back to Home
      </a>

    </div>

  </div>


  <script>

    function togglePassword() {

      const password =
        document.getElementById("password");

      const button =
        document.querySelector(".show-password");

      if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

      } else {

        password.type = "password";
        button.textContent = "Show";

      }
    }


    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        if (!email || !password) {

          message.textContent =
            "⚠️ Please fill in all fields.";

          return;
        }


        message.textContent =
          "✅ Login form submitted successfully.";

      });

  </script>

</body>
</html>
