<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | SomCity</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #07111f;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #142033;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #2f8cff;
    }

    .subtitle {
      text-align: center;
      color: #9caabd;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #35465d;
      border-radius: 9px;
      background: #0b1626;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2f8cff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2f8cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2478dc;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
      color: #9caabd;
    }

    a {
      color: #2f8cff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      🎮 Som<span>City</span>
    </div>

    <p class="subtitle">
      Login to your SomCity account
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        🔐 LOGIN
      </button>

    </form>

    <div id="message"></div>

    <div class="links">

      <p>
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>

      <a href="index.html">🏠 Back Home</a>

    </div>

  </div>


  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
      "https://ayaaiycdzuzxcouybknc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_RGaGCj_L5Mc548GoyJHp-w_0ee65lBC";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // ELEMENTS
    // ==============================

    const form =
      document.getElementById("loginForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // ==============================
    // MESSAGE
    // ==============================

    function showMessage(text, color) {

      message.textContent = text;
      message.style.color = color;

    }


    // ==============================
    // LOGIN
    // ==============================

    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      const userEmail =
        email.value.trim();

      const userPassword =
        password.value;

      if (!userEmail || !userPassword) {

        showMessage(
          "❌ Please enter email and password.",
          "#ff6b6b"
        );

        return;
      }

      button.disabled = true;
      button.textContent = "⏳ Logging in...";

      showMessage(
        "Checking your account...",
        "#9caabd"
      );


      try {

        const result =
          await supabaseClient.auth.signInWithPassword({

            email: userEmail,

            password: userPassword

          });


        const data = result.data;
        const error = result.error;


        // ==============================
        // ERROR
        // ==============================

        if (error) {

          console.error(
            "Supabase Login Error:",
            error
          );

          showMessage(
            "❌ " + error.message,
            "#ff6b6b"
          );

          button.disabled = false;
          button.textContent = "🔐 LOGIN";

          return;
        }


        // ==============================
        // USER CHECK
        // ==============================

        if (!data || !data.user) {

          showMessage(
            "❌ Login failed. User not found.",
            "#ff6b6b"
          );

          button.disabled = false;
          button.textContent = "🔐 LOGIN";

          return;
        }


        // ==============================
        // SUCCESS
        // ==============================

        showMessage(
          "✅ Login successful!",
          "#4ade80"
        );

        button.textContent = "✅ Logged in";


        // Save basic login state
        localStorage.setItem(
          "somcity_logged_in",
          "true"
        );

        localStorage.setItem(
          "somcity_user_id",
          data.user.id
        );


        // Go home
        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 800);

      }


      catch (err) {

        console.error(err);

        showMessage(
          "❌ Connection error. Please try again.",
          "#ff6b6b"
        );

        button.disabled = false;
        button.textContent = "🔐 LOGIN";

      }

    });


    // ==============================
    // CHECK SESSION
    // ==============================

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          return;
        }


        if (
          data &&
          data.session &&
          data.session.user
        ) {

          window.location.href =
            "index.html";

        }

      }

      catch (err) {

        console.error(err);

      }

    }


    checkSession();

  </script>

</body>
</html>
