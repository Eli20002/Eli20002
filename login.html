<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | GameZone</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070b12;
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #111827;
      padding: 35px;
      border-radius: 18px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #38bdf8;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      🎮 Game<span>Zone</span>
    </div>

    <p class="subtitle">
      Login to your GameZone account
    </p>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        🔐 LOGIN
      </button>

    </form>

    <div id="message"></div>

    <div class="links">

      <p>
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>

      <a href="index.html">🏠 Back Home</a>

    </div>

  </div>


  <script>

    const SUPABASE_URL = "YOUR_PROJECT_URL";

    const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        message.textContent =
          "Logging in...";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.textContent =
            "❌ " + error.message;

          return;
        }


        message.textContent =
          "✅ Login successful!";


        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 1000);

      });

  </script>

</body>
</html>
