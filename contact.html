<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact - GameZone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b12;
      color: white;
      text-align: center;
    }

    header {
      background: #111827;
      padding: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .contact {
      min-height: 80vh;
      padding: 70px 20px;
      background: linear-gradient(135deg, #111827, #172554);
    }

    .contact h1 {
      font-size: 45px;
      margin-bottom: 20px;
    }

    .contact p {
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .contact-box {
      max-width: 500px;
      margin: auto;
      background: #111827;
      padding: 30px;
      border-radius: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    button,
    .btn {
      display: inline-block;
      padding: 14px 30px;
      margin-top: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover,
    .btn:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 20px;
      color: #38bdf8;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      background: #05070c;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎮 GameZone</div>
  </header>

  <section class="contact">

    <h1>Contact Us</h1>

    <p>
      Have a question or want to contact GameZone?
    </p>

    <div class="contact-box">

      <input type="text" id="name" placeholder="Your Name">

      <input type="email" id="email" placeholder="Your Email">

      <textarea id="messageText" placeholder="Your Message"></textarea>

      <button onclick="sendMessage()">Send Message 📩</button>

      <div id="message"></div>

      <a href="index.html" class="btn">🏠 Back Home</a>

    </div>

  </section>

  <footer>
    © 2026 GameZone — All Rights Reserved.
  </footer>

  <script>
    function sendMessage() {

      const name = document.getElementById("name").value;

      const email = document.getElementById("email").value;

      const message = document.getElementById("messageText").value;

      if (name === "" || email === "" || message === "") {
        document.getElementById("message").innerHTML =
          "⚠️ Please fill in all fields.";
        return;
      }

      document.getElementById("message").innerHTML =
        "✅ Message ready! Thank you, " + name + ".";
    }
  </script>

</body>
</html>
