<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SomCity</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 70px;
      background: #101b2d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #2f8cff;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
    }

    nav a:hover {
      background: #1d3150;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 70px 20px;
    }

    .hero-box {
      background: linear-gradient(135deg, #132d4b, #102033);
      padding: 45px 30px;
      border-radius: 18px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #2f8cff;
    }

    .hero p {
      color: #9caabd;
      font-size: 17px;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 40px;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      background: #142033;
      padding: 22px;
      border-radius: 14px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #9caabd;
      line-height: 1.5;
    }

    .game-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .date {
      color: #6f829c;
      font-size: 13px;
      margin-top: 12px;
    }

    .loading,
    .empty,
    .error {
      background: #142033;
      padding: 20px;
      border-radius: 12px;
      color: #9caabd;
    }

    footer {
      background: #101b2d;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
      color: #718198;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 15px;
      }

      nav a {
        padding: 7px;
        font-size: 13px;
      }

      .hero {
        padding: 30px 15px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .container {
        padding: 0 15px 30px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      Som<span>City</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>

  </header>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-box">

      <h1>
        Welcome to <span>SomCity</span>
      </h1>

      <p>
        Discover games, news and updates from SomCity.
      </p>

    </div>

  </section>


  <main class="container">

    <!-- GAMES -->
    <section class="section">

      <h2>🎮 Games</h2>

      <div id="gamesList" class="grid">

        <div class="loading">
          Loading games...
        </div>

      </div>

    </section>


    <!-- NEWS -->
    <section class="section">

      <h2>📰 Latest News</h2>

      <div id="newsList">

        <div class="loading">
          Loading news...
        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    © 2026 SomCity. All rights reserved.

  </footer>


  <script>

    /* ===============================
       SUPABASE
    =============================== */

    const SUPABASE_URL =
      "https://ayaaiycdzuzxcouybknc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_RGaGCj_L5Mc548GoyJHp-w_0ee65lBC";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ===============================
       LOAD GAMES
    =============================== */

    async function loadGames() {

      const list =
        document.getElementById("gamesList");

      const { data, error } =
        await supabaseClient
          .from("game")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        list.innerHTML = `
          <div class="error">
            Could not load games.
          </div>
        `;

        console.error(error);

        return;
      }


      if (!data || data.length === 0) {

        list.innerHTML = `
          <div class="empty">
            No games available yet.
          </div>
        `;

        return;
      }


      list.innerHTML = "";


      data.forEach(game => {

        const card =
          document.createElement("div");

        card.className = "card";


        card.innerHTML = `
          <div class="game-icon">🎮</div>
          <h3></h3>
          <p>Play and discover this game on SomCity.</p>
        `;


        card.querySelector("h3").innerText =
          game.games || "Unnamed Game";


        list.appendChild(card);

      });

    }


    /* ===============================
       LOAD NEWS
    =============================== */

      const list =
        document.getElementById("newsList");


      const { data, error } =
        await supabaseClient
          .from("news")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        list.innerHTML = `
          <div class="error">
            Could not load news.
          </div>
        `;

        console.error(error);

        return;
      }


      if (!data || data.length === 0) {

        list.innerHTML = `
          <div class="empty">
            No news available yet.
          </div>
        `;

        return;
      }


      list.innerHTML = "";


      data.forEach(news => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.style.marginBottom = "12px";


        const title =
          document.createElement("h3");

        title.innerText =
          "📰 " + (news.title || "News");


        const content =
          document.createElement("p");

        content.innerText =
          news.content || "";


        const date =
          document.createElement("div");

        date.className = "date";


        if (news.created_at) {

          date.innerText =
            new Date(news.created_at)
              .toLocaleString();

        }


        card.appendChild(title);
        card.appendChild(content);
        card.appendChild(date);

        list.appendChild(card);

      });

    }


    /* ===============================
       START
    =============================== */

    loadGames();
    loadNews();

  </script>

</body>
</html>
