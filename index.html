<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameZone</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1220;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #151f32;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      color: #9ca8bb;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #334158;
      border-radius: 8px;
      background: #0d1627;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #4285ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4285ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #9ca8bb;
    }

    .switch span {
      color: #4285ff;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .dashboard h2 {
      margin-bottom: 15px;
    }

    .user-email {
      color: #4285ff;
      margin-bottom: 25px;
    }

    .logout {
      background: #e53935;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- LOGIN / SIGN UP -->
    <div id="authBox">

      <h1 id="title">Login</h1>

      <p class="sub" id="subtitle">
        Login to your GameZone account
      </p>

      <input
        type="text"
        id="name"
        class="hidden"
        placeholder="Your name"
      >

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="authButton" onclick="authAction()">
        Login
      </button>

      <div id="message"></div>

      <div class="switch">
        <span id="switchText">
          Don't have an account?
        </span>

        <span onclick="switchMode()" id="switchButton">
          Sign Up
        </span>
      </div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">

      <h2>Welcome to GameZone 🎮</h2>

      <p class="user-email" id="userEmail"></p>

      <p>
        You are successfully logged in.
      </p>

      <br>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </div>


<script>

  // =====================================
  // SUPABASE
  // =====================================

  const SUPABASE_URL =
    "https://alkqucmjfzzdseqegcmg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_jMs8onilE4SFfDZQk1-_ag_imMUIJXj";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================
  // LOGIN / SIGN UP MODE
  // =====================================

  let signupMode = false;


  // =====================================
  // SWITCH
  // =====================================

  function switchMode() {

    signupMode = !signupMode;

    const title =
      document.getElementById("title");

    const subtitle =
      document.getElementById("subtitle");

    const name =
      document.getElementById("name");

    const button =
      document.getElementById("authButton");

    const switchText =
      document.getElementById("switchText");

    const switchButton =
      document.getElementById("switchButton");

    const message =
      document.getElementById("message");

    message.innerText = "";

    if (signupMode) {

      title.innerText = "Create Account";

      subtitle.innerText =
        "Create your GameZone account";

      name.classList.remove("hidden");

      button.innerText = "Sign Up";

      switchText.innerText =
        "Already have an account?";

      switchButton.innerText =
        "Login";

    } else {

      title.innerText = "Login";

      subtitle.innerText =
        "Login to your GameZone account";

      name.classList.add("hidden");

      button.innerText = "Login";

      switchText.innerText =
        "Don't have an account?";

      switchButton.innerText =
        "Sign Up";
    }
  }


  // =====================================
  // AUTH
  // =====================================

  async function authAction() {

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.innerText = "";

    if (!email || !password) {

      message.innerText =
        "Please enter email and password.";

      return;
    }


    // =====================================
    // SIGN UP
    // =====================================

    if (signupMode) {

      if (!name) {

        message.innerText =
          "Please enter your name.";

        return;
      }

      if (password.length < 6) {

        message.innerText =
          "Password must be at least 6 characters.";

        return;
      }

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      if (error) {

        message.innerText =
          error.message;

        return;
      }


      // User already logged in
      if (data.session) {

        showDashboard(data.user);

      } else {

        message.innerText =
          "Account created successfully!";

        switchMode();
      }

      return;
    }


    // =====================================
    // LOGIN
    // =====================================

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.innerText =
        error.message;

      return;
    }


    showDashboard(data.user);

  }


  // =====================================
  // DASHBOARD
  // =====================================

  function showDashboard(user) {

    document.getElementById("authBox")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    document.getElementById("userEmail")
      .innerText = user.email;

  }


  // =====================================
  // LOGOUT
  // =====================================

  async function logout() {

    const { error } =
      await supabaseClient.auth.signOut();


    if (error) {

      alert(error.message);

      return;
    }


    document.getElementById("dashboard")
      .style.display = "none";

    document.getElementById("authBox")
      .style.display = "block";

    document.getElementById("email")
      .value = "";

    document.getElementById("password")
      .value = "";

    document.getElementById("name")
      .value = "";

  }


  // =====================================
  // CHECK SESSION
  // =====================================

  async function checkUser() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      showDashboard(
        data.session.user
      );

    }

  }


  // =====================================
  // AUTH STATE CHANGE
  // =====================================

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session) {

        showDashboard(session.user);

      }

    }
  );


  // Start
  checkUser();

</script>

</body>
</html>
