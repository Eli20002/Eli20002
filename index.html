<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SomCity</title>

  <meta
    name="description"
    content="SomCity"
  >

  <meta name="author" content="SomCity">

  <meta name="theme-color" content="#0b1220">

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1220'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%232f8cff'%3ES%3C/text%3E%3C/svg%3E"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #102a43);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: #142033;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 38px;
    }

    .logo span {
      color: #2f8cff;
    }

    .sub {
      text-align: center;
      color: #9caabd;
      margin-top: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #35465d;
      border-radius: 9px;
      background: #0b1626;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2f8cff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2f8cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #9caabd;
    }

    .switch span:last-child {
      color: #2f8cff;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #dbe7f5;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .dashboard h2 {
      margin-bottom: 12px;
    }

    .email {
      color: #2f8cff;
      margin-bottom: 20px;
    }

    .logout {
      background: #e53935;
      margin-top: 25px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- AUTH -->
    <div id="authBox">

      <div class="logo">
        <h1>Som<span>City</span></h1>

        <p class="sub" id="subtitle">
          Welcome to SomCity
        </p>
      </div>

      <input
        type="text"
        id="name"
        class="hidden"
        placeholder="Your name"
      >

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button
        id="authButton"
        onclick="authAction()"
      >
        Login
      </button>

      <div id="message"></div>

      <div class="switch">

        <span id="switchText">
          Don't have an account?
        </span>

        <span
          onclick="switchMode()"
          id="switchButton"
        >
          Sign Up
        </span>

      </div>

    </div>

    <!-- DASHBOARD -->
    <div
      id="dashboard"
      class="dashboard"
    >

      <div class="logo">
        <h1>Som<span>City</span></h1>
      </div>

      <h2>
        Welcome to SomCity 🎮
      </h2>

      <p
        class="email"
        id="userEmail"
      ></p>

      <p>
        You are successfully logged in.
      </p>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>

<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://ayaaiycdzuzxcouybknc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_RGaGCj_L5Mc548GoyJHp-w_0ee65lBC";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // MODE
  // ==============================

  let signupMode = false;


  // ==============================
  // SWITCH LOGIN / SIGN UP
  // ==============================

  function switchMode() {

    signupMode = !signupMode;

    const name =
      document.getElementById("name");

    const subtitle =
      document.getElementById("subtitle");

    const button =
      document.getElementById("authButton");

    const switchText =
      document.getElementById("switchText");

    const switchButton =
      document.getElementById("switchButton");

    const message =
      document.getElementById("message");

    message.innerText = "";

    if (signupMode) {

      subtitle.innerText =
        "Create your SomCity account";

      name.classList.remove("hidden");

      button.innerText =
        "Sign Up";

      switchText.innerText =
        "Already have an account?";

      switchButton.innerText =
        "Login";

    } else {

      subtitle.innerText =
        "Welcome to SomCity";

      name.classList.add("hidden");

      button.innerText =
        "Login";

      switchText.innerText =
        "Don't have an account?";

      switchButton.innerText =
        "Sign Up";
    }
  }


  // ==============================
  // AUTH
  // ==============================

  async function authAction() {

    const name =
      document.getElementById("name")
        .value.trim();

    const email =
      document.getElementById("email")
        .value.trim();

    const password =
      document.getElementById("password")
        .value;

    const message =
      document.getElementById("message");

    message.innerText = "";


    if (!email || !password) {

      message.innerText =
        "Please enter email and password.";

      return;
    }


    // SIGN UP

    if (signupMode) {

      if (!name) {

        message.innerText =
          "Please enter your name.";

        return;
      }

      if (password.length < 6) {

        message.innerText =
          "Password must be at least 6 characters.";

        return;
      }

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      if (error) {

        message.innerText =
          error.message;

        return;
      }


      if (data.session) {

        showDashboard(data.user);

      } else {

        message.innerText =
          "Account created successfully!";

      }

      return;
    }


    // LOGIN

    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (error) {

      message.innerText =
        error.message;

      return;
    }


    showDashboard(data.user);
  }


  // ==============================
  // DASHBOARD
  // ==============================

  function showDashboard(user) {

    document.getElementById("authBox")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    document.getElementById("userEmail")
      .innerText = user.email;

  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    const { error } =
      await supabaseClient.auth.signOut();

    if (error) {

      alert(error.message);

      return;
    }

    document.getElementById("dashboard")
      .style.display = "none";

    document.getElementById("authBox")
      .style.display = "block";

  }


  // ==============================
  // CHECK SESSION
  // ==============================

  async function checkUser() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      showDashboard(
        data.session.user
      );

    }
  }


  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session) {

        showDashboard(
          session.user
        );

      }

    }
  );


  checkUser();

</script>

</body>
  </html>
