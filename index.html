<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameZone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b12;
      color: white;
    }

    header {
      background: #111827;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #111827, #172554);
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    section {
      padding: 60px 7%;
      text-align: center;
    }

    h2 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .game {
      background: #111827;
      padding: 30px 20px;
      border-radius: 12px;
      border: 1px solid #1f2937;
    }

    .game h3 {
      margin: 15px 0;
    }

    .game p {
      color: #94a3b8;
      line-height: 1.6;
    }

    .icon {
      font-size: 45px;
    }

    footer {
      background: #05070c;
      padding: 25px;
      text-align: center;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 0 6px;
        font-size: 13px;
      }

      .hero h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎮 GameZone</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#games">Games</a>
      <a href="#about">About</a>
      <a href="#download">Download</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <div>
